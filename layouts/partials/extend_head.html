{{- /* 홈페이지 WebSite와 작성자 Person을 별도 엔터티로 선언한다. */ -}}
{{- if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": {{ site.Title }},
  "url": {{ site.BaseURL }},
  "inLanguage": "ko-KR",
  "publisher": {
    "@type": "Person",
    "name": {{ site.Params.author }},
    "url": {{ "/about/" | absURL }}
  }
}
</script>
{{- end }}
{{- with .Params.redirectTo }}
<meta http-equiv="refresh" content="0; url={{ . | relURL }}">
{{- end }}
